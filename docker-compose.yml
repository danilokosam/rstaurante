# Local PostgreSQL for development and tests only (never used in production).
# Matches the major version used by Supabase projects (PostgreSQL 17).
services:
  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    ports:
      # Bound to localhost only: the database is not reachable from the network.
      - '127.0.0.1:5433:5432'
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: rstaurante
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./docker/postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U postgres']
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  pgdata:
