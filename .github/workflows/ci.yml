# Continuous Integration (ADR-0012).
# Every pull request to main and every push to main must pass these checks.
name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Quality (format, lint, types, unit tests, audit)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6 # version read from "packageManager" in package.json

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Check formatting
        run: pnpm format:check

      - name: Lint
        run: pnpm lint

      - name: Typecheck
        run: pnpm typecheck

      - name: Unit tests
        run: pnpm test:unit

      - name: Dependency audit (high and critical)
        run: pnpm audit --audit-level=high

  app:
    name: App (migrations, integration tests, build, e2e)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: rstaurante
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      # Throwaway CI-only databases and URL; no real credentials are used in CI.
      DATABASE_URL: postgres://postgres:postgres@localhost:5432/rstaurante
      DATABASE_URL_TEST: postgres://postgres:postgres@localhost:5432/rstaurante_test
      NEXT_PUBLIC_SERVER_URL: http://localhost:3000
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Generate an ephemeral PAYLOAD_SECRET
        run: |
          secret="$(openssl rand -hex 32)"
          echo "::add-mask::$secret"
          echo "PAYLOAD_SECRET=$secret" >> "$GITHUB_ENV"

      - name: Create the test database
        run: psql "$DATABASE_URL" -c 'CREATE DATABASE rstaurante_test;'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Apply migrations to an empty database (same command as production)
        run: pnpm migrate

      - name: Fail if the schema changed without a migration
        run: |
          pnpm migrate:create --skip-empty schema-drift-check
          if [ -n "$(git status --porcelain --untracked-files=all src/migrations)" ]; then
            echo "::error::The Payload schema changed but no migration was committed. Run 'pnpm migrate:create <name>' and commit the generated files."
            git status --porcelain --untracked-files=all src/migrations
            exit 1
          fi

      - name: Integration tests
        run: pnpm test:int

      - name: Build
        run: pnpm build

      - name: Install Playwright browser
        run: pnpm exec playwright install --with-deps chromium

      - name: End-to-end tests (against the production build)
        run: pnpm test:e2e

      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7
